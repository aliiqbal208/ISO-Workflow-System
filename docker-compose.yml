services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: iso-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Flask Backend ──
  backend:
    build: ./backend
    container_name: iso-backend
    ports:
      - "5007:5007"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=iso_workflow
      - PORT=5007
    depends_on:
      mongo:
        condition: service_healthy

  # ── React Frontend ──
  frontend:
    build: ./frontend
    container_name: iso-frontend
    ports:
      - "3007:3007"
    environment:
      - VITE_API_URL=http://backend:5007
    depends_on:
      - backend

volumes:
  mongo_data:
